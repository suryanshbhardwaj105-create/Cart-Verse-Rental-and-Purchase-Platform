<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart-Verse Login</title>
    <link rel="stylesheet" href="login.css">
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
    }

    body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#232f3e,#37475a);
    }

.login-container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.login-container h1{
    color:#232f3e;
    margin-bottom:10px;
}

.login-container h2{
    margin-bottom:20px;
    color:#555;
}

.login-container input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:15px;
    transition:0.3s;
}

.login-container input:focus{
    border-color:#ff9900;
    outline:none;
    box-shadow:0 0 5px rgba(255,153,0,0.4);
}

.login-container button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:linear-gradient(45deg,#ff9900,#ff5e00);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-container button:hover{
    transform:scale(1.05);
    box-shadow:0 6px 15px rgba(255,94,0,0.4);
}

.register-link{
    margin-top:15px;
    font-size:14px;
}

.register-link a{
    color:#ff5e00;
    font-weight:bold;
    text-decoration:none;
}

.register-link a:hover{
    text-decoration:underline;
}

@media(max-width:400px){
    .login-container{
        width:90%;
    }
}</style>
</head>

<body>

<div class="login-container">

    <h1>CART-VERSE</h1>
    <h2>User Login</h2>

    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button onclick="loginUser()">Login</button>

    <p class="register-link">
        Don't have account?
        <a href="register.html" style="color:chartreuse;">Register</a>
    </p>

</div>
<script>
function checkLogin(){

    const token = localStorage.getItem("token");
    const authDiv = document.getElementById("auth-buttons");

    if(!authDiv) return;

    
    if(!token){
        authDiv.innerHTML = `
            <a href="login.html">
                <button class="login-btn">Login</button>
            </a>
        `;
    }
    else{
        authDiv.innerHTML = `<button class="logout-btn" onclick="logoutUser()">Logout</button>`;
    }
}

function logoutUser(){
    localStorage.removeItem("token");
    alert("Logged out successfully");
    window.location.href="login.html";
}

checkLogin();
</script>

<script>
async function loginUser(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://localhost:5000/login",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(data.success){
        localStorage.setItem("token", data.token);
        alert("Login Successful ✅");
        window.location.href="oindex.html";
    }else{
        alert(data.message);
    }
}
</script>

</body>
</html>
