<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment - Cart-Verse</title>

<style>
body{
    font-family: Arial;
    background:#f1f3f6;
    text-align:center;
}

.container{
    width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:20px;
}

.payment-option{
    margin:15px 0;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.payment-option:hover{
    background:#f9f9f9;
}

button{
    margin-top:20px;
    padding:12px;
    width:100%;
    border:none;
    background:#fb641b;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#d95413;
}

.qr{
    display:block;
}

</style>
</head>

<body>

<div class="container">
    <h2>Select Payment Method</h2>
    <h3 id="totalAmount"></h3>

    <!-- Cash -->
    <div class="payment-option" onclick="selectPayment('cash')">
        💵 Cash on Delivery
    </div>

    <!-- QR -->
    <div class="payment-option" onclick="selectPayment('qr')">
        📱 Pay via QR Code
    </div>

    <!-- QR Image -->
    <div class="qr" id="qrBox">
        <h3>Scan & Pay</h3>
        <img src="qr.png">
        <p>Scan this QR using PhonePe / GPay / Paytm</p>
    </div>

    <button onclick="confirmPayment()">Confirm Payment</button>
</div>

<script>

let method = "";

/* ===== PAYMENT SELECT ===== */
function selectPayment(type){
    method = type;

    if(type === "qr"){
        document.getElementById("qrBox").style.display = "block";
    }else{
        document.getElementById("qrBox").style.display = "none";
    }
}

/* ===== CONFIRM PAYMENT ===== */
function confirmPayment(){

    if(method === ""){
        alert("Please select payment method");
        return;
    }

    if(method === "cash"){
        alert("Order placed with Cash on Delivery 💵");
    }

    if(method === "qr"){
        alert("Payment successful via QR ✅");
    }

    localStorage.removeItem("cart");
    window.location.href = "oindex.html";
}

/* ===== TOTAL AMOUNT SHOW ===== */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

cart.forEach(item => {
    total += item.price * item.days;
});

document.getElementById("totalAmount").innerText =
    "Total Amount: ₹" + total;

</script>



</body>
</html>
